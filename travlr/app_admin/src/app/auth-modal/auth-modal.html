@if (modal.isOpen()) {
    <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true"
        aria-labelledby="authModalTitle" (click)="close()">
        <div class="modal-dialog modal-dialog-centered" [class.modal-lg]="!isLogin()" (click)="$event.stopPropagation()">
            <div class="modal-content auth-panel">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title" id="authModalTitle">{{ isLogin() ? 'Login' : 'Sign Up' }}</h2>
                    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
                </div>
                <div class="modal-body">
                    <form (ngSubmit)="onSubmit()" novalidate class="auth-grid" [class.auth-grid-wide]="!isLogin()">
                        @if (formError) {
                            <div role="alert" class="alert alert-danger py-2">{{ formError }}</div>
                        }

                        @if (isLogin()) {
                            <label for="loginEmail" class="col-form-label auth-label">Email:</label>
                            <input #firstInput type="email" class="form-control" id="loginEmail" name="email"
                                        autocomplete="email" [(ngModel)]="credentials.email">
                            <label for="loginPassword" class="col-form-label auth-label">Password:</label>
                            <input type="password" class="form-control" id="loginPassword" name="password"
                                        autocomplete="current-password" [(ngModel)]="credentials.password">
                            <div class="auth-field d-flex align-items-center gap-3">
                                <button type="submit" class="btn btn-primary" [disabled]="submitting">Login</button>
                                <a href="#" (click)="stayHere($event)">Forgot password?</a>
                            </div>
                        } @else {
                            <label for="signupName" class="col-form-label auth-label">* Name:</label>
                            <input #firstInput type="text" class="form-control" id="signupName" name="name"
                                        autocomplete="name" [(ngModel)]="credentials.name">
                            <label for="signupEmail" class="col-form-label auth-label">* Email:</label>
                            <input type="email" class="form-control" id="signupEmail" name="email"
                                        autocomplete="email" [(ngModel)]="credentials.email">
                            <label for="signupPassword" class="col-form-label auth-label">* Password:</label>
                            <div class="d-flex align-items-center gap-2 auth-hint-row">
                                <input type="password" class="form-control auth-short" id="signupPassword" name="password"
                                        autocomplete="new-password" [(ngModel)]="credentials.password">
                                <span class="password-hint" title="Use at least 8 characters" aria-label="Password requirements">?</span>
                            </div>
                            <label for="signupConfirm" class="col-form-label auth-label">* Re-type password:</label>
                            <input type="password" class="form-control auth-short" id="signupConfirm" name="confirmPassword"
                                        autocomplete="new-password" [(ngModel)]="credentials.confirmPassword">
                            <div class="auth-field form-check text-nowrap">
                                <input type="checkbox" class="form-check-input" id="signupAgree" name="agreed"
                                    [(ngModel)]="credentials.agreed">
                                <label class="form-check-label" for="signupAgree">
                                    I agree to the <a href="#" (click)="stayHere($event)">Terms of Use</a>
                                    and <a href="#" (click)="stayHere($event)">Privacy Policy</a>.
                                </label>
                            </div>
                            <div class="auth-field d-flex align-items-center gap-3">
                                <button type="submit" class="btn btn-primary" [disabled]="submitting">Sign up</button>
                                <a href="#" (click)="stayHere($event)">Learn more</a>
                            </div>
                        }
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0 justify-content-center">
                    @if (isLogin()) {
                        <small>Need an account? <a href="#" (click)="switchTo('signup', $event)">Sign up</a></small>
                    } @else {
                        <small>Already have an account? <a href="#" (click)="switchTo('login', $event)">Log in</a></small>
                    }
                </div>
            </div>
        </div>
    </div>
    <div class="modal-backdrop show"></div>
}
