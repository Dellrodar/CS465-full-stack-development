<div class="text-center my-4">
    <h1>Welcome to Travlr Getaways</h1>
    <p class="lead text-muted">Explore our destinations and book your next getaway.</p>
</div>
<div class="row g-3">
    @for (destination of destinations; track destination.image) {
        <div class="col-md-4">
            <a routerLink="/travel" class="text-decoration-none">
                <div class="card destination">
                    <img src="assets/images/{{ destination.image }}" class="card-img" alt="{{ destination.name }}">
                    <div class="card-img-overlay d-flex align-items-end">
                        <h5 class="card-title text-white mb-0">{{ destination.name }}</h5>
                    </div>
                </div>
            </a>
        </div>
    }
</div>
